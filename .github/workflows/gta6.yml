name: GTA VI Leclerc watch

on:
  schedule:
    # Toutes les 5 min de 08:00 à 22:55 UTC = 9h00 -> 23h55 heure Algérie 
    - cron: "*/5 8-22 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notif de test"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
        shell: python
        run: |
          import os, urllib.request, urllib.error
          from datetime import datetime, timezone

          URL = "https://www.e.leclerc/fp/grand-theft-auto-vi-code-in-a-box-xbox-series-5026555370103"
          TOPIC = os.environ["NTFY_TOPIC"]

          def notify(title, msg, priority="urgent", tags="video_game"):
              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}", data=msg.encode(),
                  headers={"Title": title.encode(), "Priority": priority,
                           "Tags": tags, "Click": URL}, method="POST")
              urllib.request.urlopen(req, timeout=15)

          if os.environ.get("TEST") == "true":
              notify("Test GTA VI", "Les notifs marchent 👍", priority="default")

          req = urllib.request.Request(URL, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/130.0 Safari/537.36",
              "Accept-Language": "fr-FR,fr;q=0.9",
              "Accept": "text/html,application/xhtml+xml"})
          try:
              html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore").lower()
          except Exception as e:
              print("Erreur :", e)
              html = ""

          if "grand theft auto vi" not in html:
              state = "bloque"
          elif any(m in html for m in ["épuisé", "epuise", "indisponible", "rupture"]):
              state = "epuise"
          else:
              state = "dispo"
          print("Etat :", state)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Etat : **{state}**\n")

          now = datetime.now(timezone.utc)
          if state == "dispo":
              # renotifie à chaque check tant que c'est dispo
              notify("🚨 GTA VI DISPO chez Leclerc !",
                     "Précommande Xbox dispo (60 €), fonce ! Tape pour ouvrir.")
          elif state == "epuise" and now.minute < 5:
              # point toutes les heures (1er check de l'heure)
              notify("GTA VI : rien pour l'instant",
                     f"Aucun signe de GTA VI depuis 1h (check de {(now.hour + 1) % 24}h, heure Algérie).",
                     priority="low", tags="hourglass")
          elif state == "bloque" and now.minute < 5:
              # max 1 alerte par heure si Leclerc bloque GitHub
              notify("⚠️ Script GTA bloqué",
                     "Leclerc bloque la vérif depuis GitHub, préviens Claude.",
                     priority="default", tags="warning")

          # run en rouge si Leclerc bloque, pour le voir direct dans l'onglet Actions
          if state == "bloque":
              raise SystemExit(1)
